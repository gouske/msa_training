# [PR #30 Codex follow-up — AuthProdLikeContextTest 지원]
#
# Testcontainers 의 Docker 환경 자동 감지가 일부 macOS Docker Desktop 환경에서
# 실패하여 "Could not find a valid Docker environment" 가 발생한다. socket 의
# 표준 경로(/var/run/docker.sock)를 명시해 감지 실패를 막는다.
#
# macOS Docker Desktop 4.x 는 ~/.docker/run/docker.sock 가 실 socket 이고
# /var/run/docker.sock 가 그쪽으로 가는 symlink 다. Linux CI runner 는 직접
# /var/run/docker.sock 가 socket 이므로 동일 설정이 양쪽에서 모두 작동한다.
docker.host=unix:///var/run/docker.sock
