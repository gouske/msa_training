# [K8s] Payment Service Deployment
# Python + FastAPI 기반. 경량 프로세스이므로 리소스 요구량이 낮다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: msa-training
  labels:
    app: payment-service
    context: payment    # DDD Bounded Context 식별 레이블
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: your-dockerhub/payment-service:latest
          ports:
            - containerPort: 8082

          # ConfigMap 전체 주입
          envFrom:
            - configMapRef:
                name: msa-config

          # Secret 에서 개별 값 참조
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: msa-secrets
                  key: INTERNAL_API_KEY
            # [제22강 + 회고] Consul 등록용 — Order 가 Consul 에서 payment 인스턴스를 찾는다.
            # replica 단위 유일 등록을 위해 Downward API 로 POD_IP·POD_NAME 을 주입한다.
            # 기존 CONSUL_SERVICE_ADDRESS="payment-service" 는 모든 Pod 가 K8s Service DNS 로
            # 동일 ID 등록되어 충돌했음 — POD_IP/POD_NAME 로 대체.
            - name: CONSUL_HOST
              value: "consul"
            - name: CONSUL_PORT
              value: "8500"
            # Pod 의 실제 IP — Consul Address 로 사용해 인스턴스 단위 헬스 체크가 가능해진다.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Pod 의 실제 이름 — Consul serviceId 의 유니크 키로 사용한다.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # Python FastAPI 는 경량이므로 리소스 요구량이 낮다
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # FastAPI 시작이 빠르므로 초기 대기 시간을 짧게 설정
          livenessProbe:
            httpGet:
              path: /api/payment/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /api/payment/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
