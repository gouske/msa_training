# [GitHub Actions] Auth Service CI/CD 파이프라인
#
# 트리거 조건: services/auth-service/ 하위 파일이 변경된 경우만 실행
# CI: JDK 21 + Gradle + PostgreSQL 서비스 컨테이너 + 테스트
# CD: Docker 이미지 빌드 → Docker Hub 푸시 (main 브랜치 push 시)

name: Auth Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/auth-service.yml'

jobs:
  # ─────────────────────────────────────────
  # Job 1: 테스트 실행 (CI)
  # Auth Service는 PostgreSQL 이 필요하므로
  # services 블록으로 테스트 전용 DB를 자동 기동한다.
  # ─────────────────────────────────────────
  test:
    name: 테스트 실행
    runs-on: ubuntu-latest

    # 테스트에 필요한 외부 서비스를 컨테이너로 자동 실행
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: auth_test_db
        ports:
          - 5432:5432
        # DB가 완전히 준비될 때까지 헬스체크로 대기
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # JDK 21 설치 (build.gradle.kts 의 JavaLanguageVersion.of(21) 과 일치)
      # distribution: temurin → Eclipse Temurin JDK (무료 오픈소스)
      - name: JDK 21 설정
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 캐시 설정 (빌드 속도 향상)
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      # Gradle 테스트 실행
      #
      # [PR #30 P1 #1 이후 변경] 외부 PostgreSQL 의존성 제거.
      # 과거에는 SPRING_DATASOURCE_URL 등 env 로 services PG(5432)를 강제 주입했지만,
      # 이제 다음 두 테스트가 자체적으로 DB 를 격리한다:
      #   - AuthServiceApplicationTests: @ActiveProfiles("test") → application-test.yml
      #     의 H2 in-memory 사용 (DB 미가동 환경에서도 통과)
      #   - AuthProdLikeContextTest: Testcontainers PostgreSQL 15 컨테이너 자체 기동
      # 따라서 workflow 의 SPRING_DATASOURCE_* env 주입이 오히려 H2 driver / PG URL
      # mismatch 를 일으켜 컨텍스트 로딩이 실패했다 (DriverDataSource:109). 제거.
      #
      # services PG 블록은 유지 — 향후 다른 통합 테스트가 외부 DB 를 요구할 수 있음.
      - name: 테스트 실행
        run: ./gradlew test
        working-directory: services/auth-service
        env:
          # JWT 비밀 키는 테스트 전용 더미값 사용 (실제 키 아님)
          JWT_SECRET_KEY: test-secret-key-for-ci-only-must-be-32chars
          # [PR #31 / Codex 적대적 리뷰 high finding 대응]
          # AuthProdLikeContextTest 가 @EnabledIfEnvironmentVariable 로 opt-in 처리되어
          # 있어 이 변수가 없으면 CI 에서도 자동 skip 된다. CI runner 는 Docker 가 항상
          # 가동되어 있어 Testcontainers PostgreSQL 컨테이너 기동이 가능하므로,
          # 여기서 명시적으로 true 로 활성화하여 PR/merge 게이트에서 실제 prod-like
          # 검증이 수행되도록 한다.
          RUN_PROD_LIKE_TESTS: true

  # ─────────────────────────────────────────
  # Job 2: Docker 이미지 빌드 & 푸시 (CD)
  # ─────────────────────────────────────────
  build-and-push:
    name: Docker 빌드 & 푸시
    runs-on: ubuntu-latest
    needs: test
    # [Docker Hub 푸시 활성화 가드 — ENABLE_DOCKER_PUSH variable opt-in]
    # repository variable `ENABLE_DOCKER_PUSH=true` 일 때만 실행.
    # 미설정/false 면 main push 에서도 이 job 은 자동 skip → CI 가 green 으로 유지.
    #
    # 시크릿 누락 상태에서 이 job 이 돌면 docker/login-action 이
    # "Username and password required" 로 실패해 main CI 가 red 가 된다.
    #
    # 활성화 절차:
    #   1) Docker Hub access token 발급 (Read & Write 권한)
    #   2) GitHub repo Settings → Secrets:
    #        DOCKER_USERNAME = <Docker Hub username>
    #        DOCKER_PASSWORD = <발급한 access token>
    #   3) GitHub repo Settings → Variables:
    #        ENABLE_DOCKER_PUSH = true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUSH == 'true'

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Hub 로그인
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
            ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}

  notify:
    name: 배포 완료 알림
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: 배포 결과 출력
        run: |
          echo "✅ Auth Service 배포 완료!"
          echo "이미지: ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }}"
          echo "배포 시간: $(date)"
