# [GitHub Actions] Payment Service CI/CD 파이프라인
#
# 트리거 조건: services/payment-service/ 하위 파일이 변경된 경우만 실행
# CI: Python 3.13 + pytest
# CD: Docker 이미지 빌드 → Docker Hub 푸시 (main 브랜치 push 시)

name: Payment Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/payment-service.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/payment-service.yml'

jobs:
  # ─────────────────────────────────────────
  # Job 1: 테스트 실행 (CI)
  # ─────────────────────────────────────────
  test:
    name: 테스트 실행
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Python 3.13 설치 (로컬 환경과 동일한 버전)
      - name: Python 설정
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/payment-service/requirements.txt

      # requirements.txt 에 명시된 모든 의존성 설치
      # pytest + pytest-asyncio + pytest-httpx 포함되어 있음
      - name: 의존성 설치
        run: pip install -r requirements.txt
        working-directory: services/payment-service

      # pytest 실행 (-v: 테스트별 상세 결과 출력)
      - name: 테스트 실행
        run: python -m pytest tests/ -v
        working-directory: services/payment-service
        env:
          # main.py 가 모듈 로드 시점에 INTERNAL_API_KEY 존재를 요구 (fallback 없음).
          # CI 테스트 전용 더미값 — 실제 배포 시크릿 아님.
          INTERNAL_API_KEY: test-internal-api-key-for-ci-only

  # ─────────────────────────────────────────
  # Job 2: Docker 이미지 빌드 & 푸시 (CD)
  # ─────────────────────────────────────────
  build-and-push:
    name: Docker 빌드 & 푸시
    runs-on: ubuntu-latest
    needs: test
    # [Docker Hub 푸시 활성화 가드 — ENABLE_DOCKER_PUSH variable opt-in]
    # repository variable `ENABLE_DOCKER_PUSH=true` 일 때만 실행.
    # 미설정/false 면 main push 에서도 이 job 은 자동 skip → CI 가 green 으로 유지.
    # 활성화 절차는 auth-service.yml 의 동일 가드 주석 참조.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DOCKER_PUSH == 'true'

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Docker Hub 로그인
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: services/payment-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/payment-service:latest
            ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }}

  notify:
    name: 배포 완료 알림
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: 배포 결과 출력
        run: |
          echo "✅ Payment Service 배포 완료!"
          echo "이미지: ${{ secrets.DOCKER_USERNAME }}/payment-service:${{ github.sha }}"
          echo "배포 시간: $(date)"
